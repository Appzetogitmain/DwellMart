# ─── P0-03 FIX: Terminate TLS at nginx, redirect HTTP→HTTPS, enable HSTS ──────
# P1-08 FIX: Add /uploads/ proxy so vendor/rider KYC documents are reachable

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dwellmart.in www.dwellmart.in;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dwellmart.in www.dwellmart.in;

    # TLS certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/dwellmart.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dwellmart.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.cashfree.com https://www.gstatic.com https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' wss://dwellmart.in wss://www.dwellmart.in https://api.cashfree.com https://sandbox.cashfree.com; frame-src https://sdk.cashfree.com;" always;

    root /var/www/dwellmart;
    index index.html;

    # FRONTEND (React / Vite Static Build)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BACKEND API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SOCKET.IO (WebSockets)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # P1-08 FIX: Route /uploads/ to backend so vendor & rider documents are served.
    # Access tokens (HMAC-signed) are enforced by the Express middleware for delivery-docs.
    # Vendor documents are served from this route and rely on auth middleware in Express.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Disable cache for sensitive documents
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
