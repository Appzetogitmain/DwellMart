# ─── VPS Storage Standalone Nginx Location Block ────────────────────────────
# Include this block inside your server block in /etc/nginx/sites-available/
# Or copy directly into your active Nginx site configuration.

location /images/ {
    alias /var/storage/;
    autoindex off;
    
    # 1 Year Cache for immutable WebP images and documents
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;

    # Serve static file directly or return 404
    try_files $uri =404;

    # Disable access logs for static assets to reduce disk I/O on VPS
    access_log off;
    log_not_found off;
}
